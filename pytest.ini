[pytest]
# Regression suite for the CAPEX & WBS Control Hub (remediates AUD-H-010).
# Documented entry point:  python -m pytest
testpaths = tests
pythonpath = .
# NO -q HERE, DELIBERATELY.
#
# It used to be, and because several call sites (including CI steps and
# every habitual `pytest -q`) pass -q themselves, the flags resolved to
# -qq -- whose second level suppresses the final `N passed, M skipped`
# line. Failures still printed and the exit code was still right, so
# nothing was hidden; but the COUNTS vanished, and reading the real
# number instead of inferring it from the absence of an `F` is the whole
# discipline here. Two people lost time to it, each blaming their own
# shell pipeline first.
addopts = --strict-markers --tb=short -p no:cacheprovider
markers =
    product_defect: proves an unremediated product defect; fails until the product is fixed
    slow: builds a large fixture (deep hierarchy, threaded contention)
    pg: requires a live PostgreSQL; skipped unless CAPEX_DB_URL is set
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
