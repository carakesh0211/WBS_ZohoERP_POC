# One-click deploy to Render. Push this repository to GitHub, then in Render:
#   New  ->  Blueprint  ->  select the repository.
# DO NOT SHARE THE URL. DEMO_USER / DEMO_PASSWORD gate nothing -- no
# middleware reads them -- and the only accounts in the demo profile are
# seeded identities whose passwords are the user id plus '!demo'. DEPLOY.md.
services:
  - type: web
    name: capex-wbs-control-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/run.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CAPEX_DB_PATH
        value: /tmp/capex.db      # free tier has no persistent disk. THE DATA
                                  # DOES NOT RESEED ON RESTART: `run.py`
                                  # refuses to migrate on boot (DEF-01) and
                                  # exits on a missing schema, so a restart
                                  # onto an empty /tmp yields a dead service
                                  # until the migration is run as a deploy
                                  # step. This line said "reseeds
                                  # automatically" and it never did.
      # DEMO_USER and DEMO_PASSWORD are NOT declared here. They were, as
      # `sync: false` secrets, which made them look load-bearing. Nothing in
      # `app/backend/` reads either name, so declaring them invited an
      # operator to believe the URL was gated.
