# CI for the CAPEX & WBS Control Hub.
#
# Closes the residual on AUD-H-010: "No CI pipeline is configured; the suite
# must be run manually."
#
# The gates below are ordered cheapest-first so a contract or inventory breach
# fails in seconds rather than after the four-minute regression suite.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Contract and inventory gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # AUD-M-001. Contracts can no longer drift without detection.
      - name: Contract validation
        run: python -m pytest tests/test_contracts.py -q

      # Plan section 15.1. No assertion removed or weakened without approval.
      - name: Test inventory manifest
        run: |
          python tools/build_test_manifest.py --check
          python -m pytest tests/test_manifest.py -q

      # AUD-M-007. Redaction is the gate that matters most here: structured
      # logging lets a caller attach arbitrary fields, which is exactly how a
      # regulated identifier reaches a log sink.
      - name: Observability and redaction
        run: python -m pytest tests/test_observability.py -q

      # Phase 0B Stage 1. The probe is reachable on the public internet while
      # deployed and handles a database credential, so its safety properties are
      # gated here rather than trusted to a pre-deployment checklist. The CA
      # tests run against committed synthetic fixtures, so this needs neither
      # the real Supabase certificate nor a certificate-parsing dependency.
      - name: Phase 0B probe safety and CA pinning
        run: python -m pytest docs/phase-0b/probe -q

      # Proves the sanitiser before it is ever trusted with a live response:
      # a secret embedded in free prose survived key-name redaction on first
      # run, which is exactly the class of bug this catches.
      - name: Probe evidence sanitiser self-test
        run: python docs/phase-0b/probe/probe_invoke.py --self-test

  suite:
    name: Regression suite
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt

      # The 220 baseline tests are named after the audit findings they close.
      - name: Full suite
        run: python -m pytest

  pg_tests:
    name: PostgreSQL integration suite
    runs-on: ubuntu-latest
    needs: gates
    # M1-S1. Milestone 1's PostgreSQL foundation (migrations/pg/001_foundation.sql,
    # app/backend/pg/) has no production database to test against in this job's
    # sibling `suite` run, so it gets its own service container. `ltree`,
    # `pgcrypto` and `btree_gist` ship as contrib extensions in the official
    # postgres:16 image; the migration itself does `CREATE EXTENSION IF NOT
    # EXISTS`, so nothing extra is installed here beyond a reachable server.
    services:
      postgres:
        image: postgres:16
        env:
          # Service-container defaults only - never a real credential. The
          # maintenance database (POSTGRES_DB) is deliberately left as
          # `postgres`: tests/conftest_pg.py never migrates or drops it, only
          # the disposable `capex_tmpl_*` / `capex_t<n>` databases it creates
          # from here (tests/conftest_pg.py::_assert_pg_disposable guards
          # that boundary even if CAPEX_DB_URL is ever mis-set).
          #
          # `capex` IS A SUPERUSER, and that is not incidental. The official
          # `postgres` image creates POSTGRES_USER as a cluster superuser, and
          # a superuser BYPASSES ROW-LEVEL SECURITY UNCONDITIONALLY - `FORCE
          # ROW LEVEL SECURITY` governs the table's OWNER and says nothing
          # about superusers. So no policy applies to any connection made with
          # the URL below, and for one wave that meant every RLS assertion on
          # the integration tables passed without enforcing anything.
          #
          # It is left a superuser DELIBERATELY: the migration runner needs
          # DDL, and `capex_app` (migrations/pg/004_identity_scope.sql) is
          # NOLOGIN by design, because a login password would have to ship in
          # git. The suite reaches the restricted identity from this
          # already-authenticated session instead, with `SET LOCAL ROLE
          # capex_app` - transaction-scoped, no password, and exactly the
          # `current_user` production runs as, since the application connects
          # as `capex_app` outright. See tests/conftest_pg.py's
          # `ScopedRoleDatabase` and `app/backend/pg/rls.py`.
          #
          # THEREFORE: any test asserting what a principal can or cannot SEE
          # must go through `pg_app_database` / `scoped_role_database()`, never
          # `pg_database`. tests/test_pg_rls_integration_matrix.py proves the
          # bypass empirically rather than trusting this comment.
          POSTGRES_USER: capex
          POSTGRES_PASSWORD: capex
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt

      # The service's own --health-cmd already blocks this job's steps until
      # docker reports it healthy; this is a second, self-contained check
      # using the same driver the tests use, rather than assuming `pg_isready`
      # is on the runner's PATH.
      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import sys
          import time

          import psycopg

          for attempt in range(30):
              try:
                  with psycopg.connect(
                          "postgresql://capex:capex@localhost:5432/postgres",
                          connect_timeout=3):
                      print("PostgreSQL is ready")
                      break
              except Exception as exc:
                  print(f"not ready yet ({attempt + 1}/30): {exc}")
                  time.sleep(1)
          else:
              print("PostgreSQL never became ready", file=sys.stderr)
              sys.exit(1)
          PY

      # tests/conftest_pg.py skips the whole suite cleanly (never fails) when
      # CAPEX_DB_URL is unset, which is the expected state on a dev machine
      # without a local PostgreSQL - here it is always set, so the suite runs
      # for real.
      - name: PostgreSQL integration suite
        env:
          CAPEX_DB_URL: postgresql://capex:capex@localhost:5432/postgres
          # The URL path now defaults to sslmode=verify-full, matching the
          # host-based path. A service container has no certificate to verify,
          # so TLS is relaxed HERE, explicitly, in a file a reviewer reads --
          # rather than by a permissive library default that would also have
          # silently downgraded production.
          CAPEX_DB_SSLMODE: disable
        # A GLOB, not `-m pg` and not a hand-maintained list.
        #
        # `-m pg` silently ran a third of the suite, because the modules use
        # two different gating styles (pytest.mark.pg and skipif on
        # CAPEX_DB_URL). An explicit list then omitted test_pg_locking.py and
        # test_pg_audit.py -- so the lock query and the audit chain had zero
        # execution against a real server, which is how a query PostgreSQL
        # cannot even parse reached integration.
        #
        # A filename glob cannot under-select as milestones add files, and
        # cannot break by naming a file that does not exist yet.
        #
        # -rs prints every SKIP with its reason. This job's selection has been
        # wrong twice -- `-m pg` ran a third of the suite, then a hand-written
        # list omitted the two files covering the lock query and the audit
        # chain -- and both times the job reported green while testing less
        # than it claimed. A silent skip is indistinguishable from a pass in a
        # summary line, so the reasons are now always in the log.
        run: python -m pytest -q -rs --junitxml=pg-result.xml tests/test_pg_*.py

      # A green pytest proves nothing ran wrong. It does NOT prove anything
      # ran: a suite that skipped every live test exits 0 and reports
      # success, which is how this job once passed while nine end-to-end
      # tests had quietly opted out of it, five different ways.
      #
      # CAPEX_DB_URL is set for the step above and a postgres:16 service is
      # attached, so the live tests are guaranteed runnable here. A skip in
      # that state is a broken guarantee, not an environment condition.
      #
      # Counts come from the JUnit report rather than from scraping pytest's
      # summary text: the first version of this guard parsed stdout, found
      # nothing, and reported "0 passed" on a run whose tests had all passed.
      # A guard that can be wrong about the thing it guards is worse than no
      # guard.
      - name: Prove the live tests actually ran
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pg-result.xml")
          if not report.is_file():
              sys.exit("pg-result.xml was not written: the suite did not run at all.")

          root = ET.parse(report).getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
          total = skipped = failures = errors = 0
          for suite in suites:
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
          executed = total - skipped
          print(f"live PostgreSQL suite: {total} collected, {executed} executed, "
                f"{skipped} skipped, {failures} failed, {errors} errored")

          if executed < 150:
              sys.exit(
                  f"only {executed} tests executed against the live database. "
                  f"This job attaches PostgreSQL and sets CAPEX_DB_URL, so the "
                  f"live suite must run; a low count means it skipped itself "
                  f"and the green tick means nothing.")
          if skipped:
              print(f"NOTE: {skipped} skipped; -rs prints every reason above.")
          PY

  supply_chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Resolve the real transitive closure in a clean environment, which is
      # the only place the lock and SBOM are trustworthy. tools/supply_chain.py
      # refuses to claim completeness without this.
      - name: Resolve dependency closure
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > tools/resolved.txt

      # AUD-M-006.
      - name: Vulnerability scan (OSV.dev)
        run: python tools/supply_chain.py audit --resolved tools/resolved.txt

      - name: Generate SBOM
        run: python tools/supply_chain.py sbom --resolved tools/resolved.txt

      - name: Generate hash-pinned lockfile
        run: python tools/supply_chain.py lock --resolved tools/resolved.txt

      - name: Publish supply-chain artefacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            sbom.cyclonedx.json
            vulnerability-report.json
            requirements.lock

  visual_regression:
    name: Visual regression (approved UI)
    # windows-latest, NOT ubuntu. The committed baselines carry a -win32
    # suffix because they were captured on Windows, and font rasterisation
    # differs between platforms - on Linux every snapshot would be missing,
    # which under CI is a hard failure rather than an auto-write. If the
    # team moves to Linux runners the baselines must be RE-CAPTURED there
    # and re-approved, because they would be a different artefact from the
    # one the client signed off.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install chromium

      # The webServer block in playwright.config.js points at
      # CAPEX_DB_PATH=app/data/capex_vrt.db and app/run.py seeds it on first
      # boot, so no separate seed step is needed here. A seed against the
      # default path would be a no-op and misleading to read.

      # PROVE THE GATE CAN GO RED BEFORE TRUSTING IT GREEN.
      #
      # Twice in one session a VRT run was reported passing when it had failed:
      # once because the --config path did not exist and Playwright never ran,
      # once because the command ended in `tail`, whose exit status is what the
      # shell reported. This runs a deliberately failing spec through
      # tools/run_vrt.mjs and requires a non-zero exit, then a passing one and
      # requires zero, and deletes both. It takes about three seconds and it is
      # the only thing standing between "the suite is green" and "the suite
      # reported green".
      - name: VRT exit-code guard
        run: npm run vrt:selftest

      # styles.css is the client-approved baseline. A pixel diff is a failure.
      # Invoked through the wrapper, which passes Playwright's exit code
      # through untouched -- no shell, no pipeline, no `tee`, nothing that can
      # substitute its own status for the suite's.
      - name: Visual regression
        run: npm run vrt
        env:
          CAPEX_PROFILE: local-demo

      - name: Publish diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-report
          path: tests/vrt/report
