openapi: 3.0.0
info:
  title: Bank Transactions
  description: In many instances, you would wish to record manual entries for your offline transactions for your bank or credit card accounts. These entries might not be a part of your bank feeds but would make an important entry for your business records.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.in/erp/v3
    description: API Endpoint
tags:
  - name: bank-transactions
    description: Bank Transactions Module
paths:
  /banktransactions:
    x-mcp-group:
      - Bank Transactions
    post:
      tags:
        - bank-transactions
      operationId: create_bank_transaction
      summary: Create a transaction for an account
      description: Create a bank transaction based on the allowed transaction types.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-a-transaction-for-an-account-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-a-transaction-for-an-account-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.CREATE
    get:
      tags:
        - bank-transactions
      operationId: list_bank_transactions
      summary: Get transactions list
      description: Get all the transaction details involved in an account.
      parameters:
        - name: account_id
          in: query
          description: ID of the bank account to filter transactions.
          required: false
          schema:
            type: string
          example: '460000000048001'
        - name: transaction_type
          in: query
          description: 'Type of the bank transaction. Allowed Values: <code>sales_without_invoices</code>, <code>expense_refund</code>, <code>owner_drawings</code>, <code>owner_contribution</code>, <code>interest_income</code>, <code>other_income</code>, <code>expense</code>, <code>deposit</code>'
          required: false
          schema:
            type: string
          example: deposit
        - name: date
          in: query
          description: 'Start and end date, to provide a range within which the transaction date exist. Variants: <code>date_start</code> and <code>date_end</code>'
          required: false
          schema:
            type: string
          example: '2013-10-01'
        - name: amount
          in: query
          description: 'Start and end amount, to provide a range within which the transaction amount exist. Variants: <code>amount_start</code> and <code>amount_end</code>'
          required: false
          schema:
            type: number
            format: double
          example: 2000
        - name: status
          in: query
          description: 'Status of the transaction. Values: All, uncategorized, manually_added, matched, excluded, categorized.'
          required: false
          schema:
            type: string
          example: categorized
        - name: reference_number
          in: query
          description: Search using the reference number of the transaction.
          required: false
          schema:
            type: string
          example: Ref-121
        - name: filter_by
          in: query
          description: 'Filters the transactions based on the allowed types. Allowed Values: <code>Status.All</code>, <code>Status.Uncategorized</code>, <code>Status.Categorized</code>, <code>Status.ManuallyAdded</code>, <code>Status.Excluded</code> and <code>Status.Matched</code>.'
          required: false
          schema:
            type: string
          example: ''
        - name: sort_column
          in: query
          description: 'Sorts the transactions based on the allowed sort types. Allowed Values: <code>date</code>.'
          required: false
          schema:
            type: string
          example: ''
        - name: transaction_status
          in: query
          description: 'Status of the transaction. Values: All, uncategorized, manually_added, matched, excluded, categorized.'
          required: false
          schema:
            type: string
          example: ''
        - name: search_text
          in: query
          description: Search transactions by contact name or description.
          required: false
          schema:
            type: string
          example: ''
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page. Default value is 200.
          required: false
          schema:
            type: integer
            default: 200
          example: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-transactions-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /banktransactions/{bank_transaction_id}:
    x-mcp-group:
      - Bank Transactions
    put:
      tags:
        - bank-transactions
      operationId: update_bank_transaction
      summary: Update a transaction
      description: Make changes in the applicable fields of a transaction and update it.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-a-transaction-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-a-transaction-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.UPDATE
    get:
      tags:
        - bank-transactions
      operationId: get_bank_transaction
      summary: Get transaction
      description: Fetch the details of a transaction by specifying the transaction_id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-transaction-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.READ
    delete:
      tags:
        - bank-transactions
      operationId: delete_bank_transaction
      summary: Delete a transaction
      description: Delete a transaction from an account by specifying the transaction_id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-transaction-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.DELETE
    parameters:
      - name: bank_transaction_id
        in: path
        required: true
        description: Unique identifier of the bank transaction.
        schema:
          type: string
        example: '460000000048017'
      - $ref: '#/components/parameters/organization_id'
  /banktransactions/uncategorized/{transaction_id}/match:
    x-mcp-group:
      - Bank Transactions
    get:
      tags:
        - bank-transactions
      operationId: get_matching_bank_transactions
      summary: Get matching transactions
      description: Provide criteria to search for matching uncategorised transactions. The list of transactions can also include invoices/bills/credit-notes which will not be matched directly. Instead, a new (payment/refund) transaction is recorded and matched.
      parameters:
        - name: transaction_id
          in: query
          description: ID of the transaction.
          required: false
          schema:
            type: string
          example: '460000000048017'
        - name: transaction_type
          in: query
          description: 'Type of the transaction. <br/> <strong>Allowed transaction types</strong> : deposit, refund(*Supported only in Credit Card accounts), transfer_fund, card_payment, sales_without_invoices, expense_refund, owner_contribution, interest_income, other_income, owner_drawings, sales_return <br/> <strong>Note:</strong> You will not be able to create the following module-specific transaction types under Bank Transaction endpoints :<div> <a href="#Expenses">Expense</a>, <a href="#Vendor-Payments">Vendor Advance/Vendor Payment/Bill Payment</a>, <a href="#Vendor-Credits_Refund_a_vendor_credit">Vendor Credit Refund</a>, <a href="#Vendor-Payments_Refund_an_excess_vendor_payment">Vendor Payment Refund</a>, <a href="#Customer-Payments">Customer Advance/Customer Payment</a>, <a href="#Credit-Notes_Refund_credit_note">Credit Note Refund</a>, <a href="#Customer-Payments_Refund_an_excess_customer_payment">Payment Refund</a>. Hence, refer them in their respective modules.</div>'
          required: false
          schema:
            type: string
          example: deposit
        - name: date_after
          in: query
          description: Date after which transactions are to be filtered.
          required: false
          schema:
            type: string
          example: ''
        - name: date_before
          in: query
          description: Date before which transactions are to be filtered.
          required: false
          schema:
            type: string
          example: ''
        - name: amount_start
          in: query
          description: Starting amount with which transactions are to be filtered.
          required: false
          schema:
            type: number
            format: double
          example: ''
        - name: amount_end
          in: query
          description: Ending amount with which transactions are to be filtered.
          required: false
          schema:
            type: number
            format: double
          example: ''
        - name: contact
          in: query
          description: Contact person name, involved in the transaction.
          required: false
          schema:
            type: string
          example: ''
        - name: reference_number
          in: query
          description: Reference number of the transaction.
          required: false
          schema:
            type: string
          example: Ref-121
        - name: show_all_transactions
          in: query
          description: Indicates if all transactions must be shown.
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page. Default value is 200.
          required: false
          schema:
            type: integer
            default: 200
          example: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-matching-transactions-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.READ
    post:
      tags:
        - bank-transactions
      operationId: match_bank_transaction
      summary: Match a transaction
      description: Match an uncategorized transaction with a corresponding invoice/bill/credit-note or directly with a transaction. When a transaction is matched with an invoice/bill/credit-note, a new payment/refund transaction will be created and matched with the selected transaction.
      parameters:
        - name: account_id
          in: query
          description: Mandatory Account ID for which transactions are to be listed.
          required: false
          schema:
            type: string
          example: '460000000048001'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/match-a-transaction-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/match-a-transaction-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.banking.CREATE
    parameters:
      - name: transaction_id
        in: path
        required: true
        description: Unique identifier of the bank transaction.
        schema:
          type: string
        example: '460000000048017'
      - $ref: '#/components/parameters/organization_id'
  /banktransactions/{transaction_id}/unmatch:
    x-mcp-group:
