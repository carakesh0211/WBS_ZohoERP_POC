    parameters:
      - name: transaction_id
        in: path
        required: true
        description: Unique identifier of the bank transaction.
        schema:
          type: string
        example: '460000000048017'
      - $ref: '#/components/parameters/organization_id'
  /banktransactions/uncategorized/{transaction_id}/categorize/expenses:
    x-mcp-group:
      - Bank Transactions
    post:
      tags:
        - bank-transactions
      operationId: categorize_bank_transaction_as_expense
      summary: Categorize as expense
      description: Categorize an Uncategorized transaction as expense.
      parameters:
        - name: doc
          in: query
          description: Document that is to be attached.
          required: false
          schema:
            type: string
          example: ''
        - name: totalFiles
          in: query
          description: Total number of files.
          required: false
          schema:
            type: integer
          example: 0
        - name: document_ids
          in: query
          description: Comma-separated list of document IDs to be attached to the transaction.
          required: false
          schema:
            type: string
          example: ''
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/categorize-as-expense-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categorize-as-expense-response'
      deprecated: false
