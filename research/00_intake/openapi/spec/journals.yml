openapi: 3.0.0
info:
  title: Journals
  description: Journals are used by accountants to work directly with the general ledger to create both debit and credit entries for unique financial transactions.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.in/erp/v3
    description: API Endpoint
tags:
  - name: journals
    description: Journals Module
paths:
  /journals:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: create_journal
      summary: Create a journal
      description: Create a journal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-a-journal-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-a-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    get:
      tags:
        - journals
      operationId: list_journals
      summary: Get journal list
      description: Get journal list.
      parameters:
        - name: entry_number
          in: query
          description: 'Search journals by journal entry number. Variants: <code>entry_number_startswith</code> and <code>entry_number_contains</code>'
          required: false
          schema:
            type: string
          example: '1'
        - name: reference_number
          in: query
          description: 'Search journals by journal reference number. Variants: <code>reference_number_startswith</code> and <code>reference_number_contains</code>'
          required: false
          schema:
            type: string
          example: '7355'
        - name: date
          in: query
          description: 'Search journals by journal date. Variants: <code>date_start</code>, <code>date_end</code>, <code>date_before and</code> <code>date_after</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: notes
          in: query
          description: 'Search journals by journal notes. Variants: <code>notes_startswith</code> and <code>notes_contains</code>'
          required: false
          schema:
            type: string
          example: Loan repayment
        - name: last_modified_time
          in: query
          description: Search the journals using Last Modified Time
          required: false
          schema:
            type: string
          example: 2013-09-05T17:13:31+0530
        - name: total
          in: query
          description: 'Search journals by journal total. Variants: <code>total_less_than</code>, <code>total_less_equals</code>, <code>total_greater_than</code> and <code>total_greater_equals</code>'
          required: false
          schema:
            type: number
            format: double
          example: 5000
        - name: customer_id
          in: query
          description: Search Journals using Customer ID
          required: false
          schema:
            type: string
          example: ''
        - name: vendor_id
          in: query
          description: Search the journals using Vendor ID
          required: false
          schema:
            type: string
          example: ''
        - name: filter_by
          in: query
          description: 'Filter journals by journal date. Allowed Values: <code>JournalDate.All</code>, <code>JournalDate.Today</code>, <code>JournalDate.ThisWeek</code>, <code>JournalDate.ThisMonth</code>, <code>JournalDate.ThisQuarter</code> and <code>JournalDate.ThisYear</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: sort_column
          in: query
          description: 'Sort journal list. Allowed Values: <code>journal_date</code>, <code>entry_number</code>, <code>reference_number</code>, <code>total</code> and <code>last_modified_time</code>.'
          required: false
          schema:
            type: string
          example: journal_date
        - name: status
          in: query
          description: 'Filter journals by status. Allowed Values: <code>draft</code>, <code>published</code>, <code>approved</code>, <code>submitted</code> and <code>rejected</code>.'
          required: false
          schema:
            type: string
        - name: journal_type
          in: query
          description: Filter journals by journal type.
          required: false
          schema:
            type: string
        - name: account_id
          in: query
          description: Filter journals by account ID.
          required: false
          schema:
            type: string
        - name: account_code
          in: query
          description: Search journals by account code.
          required: false
          schema:
            type: string
        - name: customview_id
          in: query
          description: ID of the custom view.
          required: false
          schema:
            type: string
        - name: journal_ids
          in: query
          description: Comma separated journal IDs. Maximum of 200.
          required: false
          schema:
            type: string
        - name: currency
          in: query
          description: Filter by currency ID.
          required: false
          schema:
            type: string
        - name: tax_id
          in: query
          description: Filter by tax ID.
          required: false
          schema:
            type: string
        - name: tax_exemption_id
          in: query
          description: Filter by tax exemption ID.
          required: false
          schema:
            type: string
        - name: tax_authority_id
          in: query
          description: Filter by tax authority ID.
          required: false
          schema:
            type: string
        - name: search_text
          in: query
          description: Search journals by text.
          required: false
          schema:
            type: string
        - name: branch_ids
          in: query
          description: Comma separated branch IDs. Maximum of 200.
          required: false
          schema:
            type: string
        - name: location_ids
          in: query
          description: Comma separated location IDs. Maximum of 200.
          required: false
          schema:
            type: string
        - name: project_id
          in: query
          description: Filter by project ID.
          required: false
          schema:
            type: string
        - name: journal_entity_type
          in: query
          description: 'Filter by journal entity type. Allowed Values: <code>journal</code>, <code>period_end_journal</code>, <code>consolidation_journal</code>, <code>consolidation_adjustment_journal</code>, <code>elimination_journal</code> and <code>intercompany_journal</code>.'
          required: false
          schema:
            type: string
        - name: period_closure_id
          in: query
          description: Filter by period closure ID.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page.
          required: false
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-journal-list-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}:
    x-mcp-group:
      - Journals
    put:
      tags:
        - journals
      operationId: update_journal
      summary: Update a journal
      description: Updates the journal with given information.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-a-journal-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-a-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.UPDATE
    get:
      tags:
        - journals
      operationId: get_journal
      summary: Get journal
      description: Get the details of the journal.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.READ
    delete:
      tags:
        - journals
      operationId: delete_journal
      summary: Delete a journal
      description: Deletes the given journal.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.DELETE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/status/publish:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: mark_journal_published
      summary: Mark a journal as published
      description: Mark a draft journal as published.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-a-journal-as-published-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/attachment:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: add_journal_attachment
      summary: Add attachment to a journal
      description: Attach a file to a journal.
      parameters:
        - name: attachment
          in: query
          description: The file that is to be added as an Attachment in the Journal
          required: false
          schema:
            type: string
            format: binary
          example: ''
        - name: doc
          in: query
          description: Document that is to be attached
          required: false
          schema:
            type: string
            format: binary
          example: ''
        - name: totalFiles
          in: query
          description: Total number of files.
          required: false
          schema:
            type: integer
          example: 0
        - name: document_ids
          in: query
          description: ID's of the document
          required: false
          schema:
            type: string
          example: ''
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add-attachment-to-a-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/comments:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: add_journal_comment
      summary: Add comment
      description: Add a comment for a journal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add-comment-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/add-comment-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/comments/{comment_id}:
    x-mcp-group:
      - Journals
    delete:
      tags:
        - journals
      operationId: delete_journal_comment
      summary: Delete a comment
      description: Delete a jounral comment.
      parameters:
        - name: comment_id
          in: path
          required: true
          description: Unique identifier of the comment.
          schema:
            type: string
          example: '460000000048023'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-comment-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.DELETE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/reverse:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: reverse_journal
      summary: Reverse a journal
      description: Reverses a journal entry.
      parameters:
        - name: reversal_date
          in: query
          description: Date on which the reversal needs to be recorded.
          required: true
          schema:
            type: string
          example: '2013-10-01'
        - name: is_reversal_scheduled
          in: query
          description: Whether the reversal is scheduled.
          required: true
          schema:
            type: boolean
          example: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reverse-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/submit:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: submit_journal_for_approval
      summary: Submit a journal for approval
      description: Submits a journal for approval.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/approve:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: approve_journal
      summary: Approve a journal
      description: Approves a journal.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/reject:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: reject_journal
      summary: Reject a journal
      description: Rejects a journal.
      parameters:
        - name: reason
          in: query
          description: Reason for rejecting the journal. Max-length [500].
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/credits:
    x-mcp-group:
      - Journals
    get:
      tags:
        - journals
      operationId: list_journal_credits
      summary: List available credits of a journal
      description: Lists available credits of a journal.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-journal-credits-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.READ
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/credits/{journal_line_id}/invoices:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: apply_journal_credits_to_invoices
      summary: Apply journal credits to invoices
      description: Applies available journal credits to invoices.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apply-credits-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - name: journal_line_id
        in: path
        required: true
        description: Unique identifier of the journal line item.
        schema:
          type: string
        example: '460000000038005'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/credits/{journal_line_id}/bills:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: apply_journal_credits_to_bills
      summary: Apply journal credits to bills
      description: Applies available journal credits to bills.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apply-credits-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - name: journal_line_id
        in: path
        required: true
        description: Unique identifier of the journal line item.
        schema:
          type: string
        example: '460000000038005'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/credits/{journal_line_id}/receivables:
    x-mcp-group:
      - Journals
    delete:
      tags:
        - journals
      operationId: delete_journal_credits_receivables
      summary: Delete applied credits from receivables
      description: Deletes applied journal credits from receivables.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.DELETE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - name: journal_line_id
        in: path
        required: true
        description: Unique identifier of the journal line item.
        schema:
          type: string
        example: '460000000038005'
      - $ref: '#/components/parameters/organization_id'
  /journals/{journal_id}/credits/{journal_line_id}/payables:
    x-mcp-group:
      - Journals
    delete:
      tags:
        - journals
      operationId: delete_journal_credits_payables
      summary: Delete applied credits from payables
      description: Deletes applied journal credits from payables.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.DELETE
    parameters:
      - name: journal_id
        in: path
        required: true
        description: Unique identifier of the journal.
        schema:
          type: string
        example: '460000000038001'
      - name: journal_line_id
        in: path
        required: true
        description: Unique identifier of the journal line item.
        schema:
          type: string
        example: '460000000038005'
      - $ref: '#/components/parameters/organization_id'
  /journals/submit:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: bulk_submit_journals
      summary: Bulk submit journals for approval
      description: Submits multiple journals for approval.
      parameters:
        - name: journal_ids
          in: query
          description: Comma separated journal IDs to be submitted. Maximum of 25.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /journals/approve:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: bulk_approve_journals
      summary: Bulk approve journals
      description: Approves multiple journals.
      parameters:
        - name: journal_ids
          in: query
          description: Comma separated journal IDs to be approved. Maximum of 25.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /journals/status/publish:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: bulk_publish_journals
      summary: Bulk publish journals
      description: Publishes multiple draft journals.
      parameters:
        - name: journal_ids
          in: query
          description: Comma separated journal IDs to be published. Maximum of 10.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/action-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /journals/bulkdelete:
    x-mcp-group:
      - Journals
    delete:
      tags:
        - journals
      operationId: bulk_delete_journals
      summary: Bulk delete journals
      description: Deletes multiple journals.
      parameters:
        - name: journal_ids
          in: query
          description: Comma separated journal IDs to be deleted. Maximum of 200.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-a-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.DELETE
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /recurringjournals:
    x-mcp-group:
      - Journals
    post:
      tags:
        - journals
      operationId: create_recurring_journal
      summary: Create a recurring journal
      description: Creates a recurring journal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-a-journal-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-a-journal-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ERP.accountants.CREATE
    get:
      tags:
        - journals
      operationId: list_recurring_journals
      summary: List recurring journals
      description: Lists all recurring journals.
      parameters:
        - name: filter_by
          in: query
          description: 'Filter recurring journals by status. Allowed Values: <code>Status.All</code>, <code>Status.Active</code>, <code>Status.Stopped</code> and <code>Status.Expired</code>.'
          required: false
          schema:
            type: string
        - name: sort_column
          in: query
          description: 'Sort recurring journals. Allowed Values: <code>created_time</code>, <code>total</code> and <code>bcy_total</code>.'
          required: false
          schema:
            type: string
        - name: account_id
          in: query
          description: Filter by account ID.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-recurring-journals-response'
      deprecated: false
